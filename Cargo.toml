[package]
name = "mnemoloom"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Search, resume, trim and hand off Claude Code and Codex sessions; watch running agents in tmux"
authors = ["Aamir Ahmad"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aamirsahmad/mnemoloom"
homepage = "https://github.com/aamirsahmad/mnemoloom"
readme = "README.md"
keywords = ["claude", "codex", "ai-agents", "tmux", "tui"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
dirs = "7.0.0"
libc = "0.2"
memchr = "2.8.3"
ratatui = "0.30.2"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
tantivy = "0.27.0"
unicode-segmentation = "1.13.3"
uuid = { version = "1.29.0", features = ["v4", "v7"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "mnemoloom"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
